name: Bootstrap Clausem

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Clausem source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/clausem.b64
          base64 -d /tmp/clausem.b64 > /tmp/clausem.zip
          unzip -oq /tmp/clausem.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Verify Python source and repository preflight
        shell: bash
        run: |
          python -m py_compile contracts/clausem.py contracts/clausem_consumer.py tests/test_clausem.py tests/conftest.py
          python scripts/preflight.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        shell: bash
        run: npm install --no-audit --no-fund --prefix frontend

      - name: Typecheck frontend
        shell: bash
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        shell: bash
        run: npm run build --prefix frontend

      - name: Attempt GenLayer Direct Mode tests
        id: direct_mode
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install -r requirements-test.txt
          pytest -q

      - name: Commit finished source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Clausem application"
          git push origin HEAD:main
