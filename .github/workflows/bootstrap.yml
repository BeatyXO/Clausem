name: Bootstrap Clausem

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand Clausem source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/clausem.b64
          base64 -d /tmp/clausem.b64 > /tmp/clausem.zip
          unzip -oq /tmp/clausem.zip -d .
          python - <<'PY'
          from pathlib import Path
          p = Path("frontend/src/lib/genlayer.ts")
          text = p.read_text()
          old = "const hash = await client.writeContract({ address: CONTRACT_ADDRESS, functionName, args: args as never[] })"
          new = "const hash = await client.writeContract({ address: CONTRACT_ADDRESS, functionName, args: args as never[], value: 0n })"
          if old in text:
              text = text.replace(old, new)
          if new not in text:
              raise SystemExit("expected SDK compatibility patch target missing")
          p.write_text(text)
          Path("requirements-test.txt").write_text("pytest>=8.0,<9\ngenlayer-test==0.29.2\ngenvm-linter\n")
          tp = Path("tests/test_clausem.py")
          tests = tp.read_text()
          old = 'return direct_deploy("contracts/clausem.py")'
          new = 'return direct_deploy("contracts/clausem.py", sdk_version="v0.2.16")'
          if old in tests:
              tests = tests.replace(old, new)
          if new not in tests:
              raise SystemExit("expected Direct Mode deploy helper not found")
          tp.write_text(tests)
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Verify Python source and repository preflight
        shell: bash
        run: |
          python -m py_compile contracts/clausem.py contracts/clausem_consumer.py tests/test_clausem.py tests/conftest.py
          python scripts/preflight.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        shell: bash
        run: npm install --no-audit --no-fund --prefix frontend

      - name: Typecheck frontend
        shell: bash
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        shell: bash
        run: npm run build --prefix frontend

      - name: Install GenLayer test tooling
        shell: bash
        run: python -m pip install -r requirements-test.txt

      - name: GenVM lint
        shell: bash
        run: genvm-lint check contracts/clausem.py

      - name: GenLayer Direct Mode tests
        shell: bash
        run: pytest -q

      - name: Commit finished source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Clausem application"
          git push origin HEAD:main
