name: Clausem Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GenLayer test tooling
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python
        run: python -m py_compile contracts/clausem.py contracts/clausem_consumer.py tests/test_clausem.py tests/conftest.py
      - name: Repository preflight
        run: python scripts/preflight.py
      - name: GenVM lint
        run: genvm-lint check contracts/clausem.py
      - name: Direct Mode tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
